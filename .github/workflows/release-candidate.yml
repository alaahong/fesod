# Release Candidate publishing workflow (Apache Fesod incubating)
#
# Automates the manual RC flow: verification gates -> signed source package ->
# SVN dist (dev) -> Nexus staging deploy(no close) -> git tag & branch push ->
# VOTE email draft. The RC is cut from an exact source commit supplied at trigger.
#
# Security: all credentials come from repository secrets, injected as env vars,
# only live for the job, and must never be echoed (see release-tools/ci docs).

name: RC Release (Candidate)

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Release revision to verify/publish, e.g. 2.1.0-incubating'
        required: true
        type: string
      rc:
        description: 'RC round number, e.g. 1'
        required: true
        type: string
      commit-sha:
        description: 'Exact source commit the RC is cut from (git tag/source archive use this commit)'
        required: true
        type: string

permissions:
  contents: write
  checks: read

concurrency:
  group: rc-release-${{ github.event.inputs.revision }}-rc${{ github.event.inputs.rc }}
  cancel-in-progress: true

env:
  REVISION: ${{ github.event.inputs.revision }}
  RC: ${{ github.event.inputs.rc }}
  COMMIT_SHA: ${{ github.event.inputs.commit-sha }}
  GIT_TAG: ${{ github.event.inputs.revision }}-rc${{ github.event.inputs.rc }}
  ASF_USERNAME: ${{ secrets.ASF_USERNAME }}
  ASF_PASSWORD: ${{ secrets.ASF_PASSWORD }}
  GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
  GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
  GIT_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  rc-release:
    name: RC Release (${{ github.event.inputs.revision }}-rc${{ github.event.inputs.rc }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: 'maven'

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Import GPG signing key
        run: bash release-tools/ci/import-gpg.sh

      - name: Generate runtime credentials (settings.xml / subversion / gpg passphrase)
        run: bash release-tools/ci/setup-creds.sh

      - name: Run verification gates (build + tests + license)
        run: bash release-tools/ci/gate-verify.sh

      - name: Create signed source package
        run: bash release-tools/ci/create-src-package.sh

      - name: Publish source package to SVN (dev dist)
        run: bash release-tools/ci/publish-svn.sh

      - name: Deploy signed artifacts to Nexus staging (no close)
        run: bash release-tools/ci/publish-nexus.sh

      - name: Push RC tag and branch at the source commit
        run: bash release-tools/ci/push-git.sh

      - name: Generate VOTE email draft
        run: bash release-tools/ci/gen-vote-email.sh

      - name: Upload VOTE email draft
        uses: actions/upload-artifact@v4
        with:
          name: VOTE-${{ env.GIT_TAG }}
          path: ${{ runner.temp }}/fesod-rc/artifacts/VOTE-${{ env.GIT_TAG }}.txt
          if-no-files-found: error

      - name: Print release summary
        if: always()
        run: bash release-tools/ci/summary.sh